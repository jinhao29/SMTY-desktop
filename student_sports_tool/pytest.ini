[pytest]
# 测试根目录固定为项目根，避免从其他 cwd 调用时收集不到
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 关键：单进程跑全套会崩（PySide6 Qt 事件循环与 pytest capture 冲突，
# 报 "ValueError: I/O operation on closed file"）。因此：
# - 关闭全局 capture 插件对 stdout 的接管：-p no:cacheprovider 保留（缓存有用）
# - 每个测试模块独立跑更稳；如需一次跑全部，请用 Py/run_tests.py（逐文件隔离）
addopts = -q --tb=short -p no:randomly

# 排除打包产物与临时目录，防止收集到 dist/ 内的历史副本
norecursedirs = dist build .git __pycache__ _update_test _db_snapshots .cache

filterwarnings =
    ignore::DeprecationWarning
