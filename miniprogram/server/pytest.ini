[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 单进程即可（无 Qt / 无事件循环依赖，纯 FastAPI TestClient，headless）
addopts = -q --tb=short

norecursedirs = __pycache__ .pytest_cache server_data _backup_before_cred_fix

filterwarnings =
    ignore::DeprecationWarning
    # FastAPI on_event 已弃用，项目仍在用，避免噪音
    ignore::PendingDeprecationWarning
